apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: default
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"

      containers:
        - name: kubernetes12
          image: 596055752329.dkr.ecr.ap-south-1.amazonaws.com/kubernetes12:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000   # change to your app's port (3000, 8080, etc.)
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /        # change to your health check path
              port: 3000     # match your containerPort
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /        # change to your health check path
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: default
spec:
  selector:
    app: web
  type: LoadBalancer       # use ClusterIP if internal only
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000     # match your containerPort
